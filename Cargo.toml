[workspace]
resolver = "3"
members = [
    "crates/isometric-cli",
    "crates/isometric-core",
    "crates/isometric-perception",
    "crates/isometric-publish",
    "crates/isometric-reference",
    "crates/isometric-render",
    "crates/isometric-source",
    "crates/isometric-style",
    "crates/isometric-validate",
    "crates/isometric-world",
]

[workspace.dependencies]
image-webp = "=0.2.4"
las = { version = "=0.11.0", default-features = false, features = ["laz"] }
proj4rs = { version = "=0.1.10", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "jpeg", "lzw"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Deepak Buddha"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbuddha/isometric-stanford"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
