[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isometric-stanford-perception"
version = "0.1.0"
description = "Pinned offline semantic-compilation contracts for Isometric Stanford"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["isometric_perception"]
