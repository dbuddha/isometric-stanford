name: Scheduled assurance

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      cache_namespace:
        description: Distinguishes deliberate cold and warm source-cache assurance runs
        required: true
        default: scheduled
        type: string

permissions:
  contents: read

jobs:
  perception-recompile:
    name: Locked NAIP and LiDAR evidence recompile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Restore exact locked source cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: artifacts/source-cache
          key: source-v1-${{ runner.os }}-${{ hashFiles('source.lock.json') }}-${{ github.event.inputs.cache_namespace || 'scheduled' }}
      - name: Synchronize exact approved source bytes
        run: |
          mkdir -p artifacts
          set -o pipefail
          cargo run --quiet --release --locked -- source sync artifacts/source-cache \
            2>&1 | tee artifacts/source-sync.log
      - name: Recompile evidence twice with bounded-memory timing
        run: |
          /usr/bin/time -v cargo run --quiet --release --locked -- perceive run artifacts/perception-first 2>artifacts/perception-first.time
          /usr/bin/time -v cargo run --quiet --release --locked -- perceive run artifacts/perception-second 2>artifacts/perception-second.time
          diff -q artifacts/perception-first/hero-evidence.json artifacts/perception-second/hero-evidence.json
          test "$(sha256sum artifacts/perception-first/hero-evidence.json | cut -d' ' -f1)" = "$(jq -r '.artifacts[0].sha256' perception.lock.json)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perception-recompile-evidence
          path: |
            artifacts/source-sync.log
            artifacts/perception-first/hero-evidence.json
            artifacts/perception-first.time
            artifacts/perception-second.time
          if-no-files-found: error

  repeatability:
    name: Three-run repeatability and release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - run: cargo test --workspace --locked
      - name: Verify bounded 8K-scale tile set
        run: cargo test --release --locked -p isometric-render eight_k_tile_set_is_deterministic_and_bounded -- --ignored --nocapture
      - run: |
          first=$(cargo run --quiet --locked -- validate render)
          second=$(cargo run --quiet --locked -- validate render)
          third=$(cargo run --quiet --locked -- validate render)
          test "$first" = "$second"
          test "$second" = "$third"
      - run: python3 scripts/validate_manifests.py
      - name: Measure three-run Candidate C DZI assurance
        run: |
          cargo build --quiet --release --locked --bin isometric-stanford
          python3 scripts/measure_prototype.py \
            --binary target/release/isometric-stanford \
            --output artifacts/assurance/prototype
      - name: Verify Candidate C repeatability without earlier-candidate drift
        run: |
          cargo run --quiet --release --locked -- style candidate-a artifacts/style/candidate-a
          cargo run --quiet --release --locked -- style candidate-b artifacts/style/candidate-b
          cargo run --quiet --release --locked -- style candidate-c artifacts/style/candidate-c-first
          cargo run --quiet --release --locked -- style candidate-c artifacts/style/candidate-c-second
          diff -qr artifacts/style/candidate-c-first artifacts/style/candidate-c-second
          test "$(sha256sum artifacts/style/candidate-a/contact-sheet.webp | cut -d' ' -f1)" = 5eed427c157c06edb992a21af846fadb298b085a9f8201fb54f4a540a42a508b
          test "$(sha256sum artifacts/style/candidate-b/contact-sheet.webp | cut -d' ' -f1)" = 01584614d321009dc2d824305ec361fab623668a1b08aa20679435eea7af8a38
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-performance-evidence
          path: artifacts/assurance/prototype/prototype-performance.json
          if-no-files-found: error

  browser:
    name: Real DZI desktop and mobile browser recovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and stage the real hero pyramid
        working-directory: .
        run: |
          cargo run --quiet --release --locked -- world compile artifacts/world
          cargo run --quiet --release --locked -- publish dzi artifacts/dzi/browser candidate-c
          cargo run --quiet --release --locked -- validate release artifacts/dzi/browser
          mkdir -p web/public/art
          cp artifacts/dzi/browser/hero.dzi web/public/art/
          cp artifacts/dzi/browser/release.json web/public/art/
          cp -R artifacts/dzi/browser/hero_files web/public/art/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DZI_URL: /isometric-stanford/art/hero.dzi
          E2E_RELEASE_URL: /isometric-stanford/art/release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-dzi-browser-evidence
          path: web/test-results
          if-no-files-found: error
