name: Scheduled assurance

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeatability:
    name: Three-run repeatability and release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - run: cargo test --workspace --locked
      - name: Verify bounded 8K-scale tile set
        run: cargo test --release --locked -p isometric-render eight_k_tile_set_is_deterministic_and_bounded -- --ignored --nocapture
      - run: |
          first=$(cargo run --quiet --locked -- validate render)
          second=$(cargo run --quiet --locked -- validate render)
          third=$(cargo run --quiet --locked -- validate render)
          test "$first" = "$second"
          test "$second" = "$third"
      - run: python3 scripts/validate_manifests.py
      - name: Verify complete hero DZI repeatability
        run: |
          cargo run --quiet --release --locked -- world compile artifacts/world
          cargo run --quiet --release --locked -- publish dzi artifacts/dzi/first
          cargo run --quiet --release --locked -- publish dzi artifacts/dzi/second
          cargo run --quiet --release --locked -- validate release artifacts/dzi/first
          cargo run --quiet --release --locked -- validate release artifacts/dzi/second
          diff -qr artifacts/dzi/first artifacts/dzi/second
      - name: Verify Candidate B repeatability without Candidate A drift
        run: |
          cargo run --quiet --release --locked -- style candidate-a artifacts/style/candidate-a
          cargo run --quiet --release --locked -- style candidate-b artifacts/style/candidate-b-first
          cargo run --quiet --release --locked -- style candidate-b artifacts/style/candidate-b-second
          diff -qr artifacts/style/candidate-b-first artifacts/style/candidate-b-second
          test "$(sha256sum artifacts/style/candidate-a/contact-sheet.webp | cut -d' ' -f1)" = 3c6f880e282778588bace57e48a3a91cbc7ad154569d8ec2933e87808bb58970

  browser:
    name: Real DZI desktop and mobile browser recovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and stage the real hero pyramid
        working-directory: .
        run: |
          cargo run --quiet --release --locked -- world compile artifacts/world
          cargo run --quiet --release --locked -- publish dzi artifacts/dzi/browser
          cargo run --quiet --release --locked -- validate release artifacts/dzi/browser
          mkdir -p web/public/art
          cp artifacts/dzi/browser/hero.dzi web/public/art/
          cp -R artifacts/dzi/browser/hero_files web/public/art/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DZI_URL: /isometric-stanford/art/hero.dzi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-dzi-browser-evidence
          path: web/test-results
          if-no-files-found: error
