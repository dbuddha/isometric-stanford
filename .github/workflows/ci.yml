name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: scripts/check-policy.sh
      - run: python scripts/test_validate_pr.py
      - if: github.event_name == 'pull_request'
        run: python scripts/validate_pr.py "$GITHUB_EVENT_PATH"
      - run: python scripts/validate_manifests.py
      - run: python scripts/validate_world_fixtures.py

  rust:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Repeat canonical reference render three times
        run: |
          first=$(cargo run --quiet --locked -- validate render)
          second=$(cargo run --quiet --locked -- validate render)
          third=$(cargo run --quiet --locked -- validate render)
          test "$first" = "$second"
          test "$second" = "$third"
      - run: cargo run --quiet --locked -- render fixture artifacts/reference.ppm
      - run: cargo run --quiet --release --locked -- world compile artifacts/world
      - run: cargo run --quiet --release --locked -- render region artifacts/render/hero.ppm
      - name: Verify canonical hero preview hash
        run: test "$(sha256sum artifacts/render/hero.ppm | cut -d' ' -f1)" = "$(jq -r '.outputs[0].sha256' render.manifest.json)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-render-evidence
          path: |
            artifacts/reference.ppm
            artifacts/render/hero.ppm
            artifacts/world/world.manifest.json
          if-no-files-found: error

  python:
    name: Python perception contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perception
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perception/requirements-dev.lock
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest

  docs:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: mdbook@0.5.4
      - run: mdbook build
      - run: mdbook test

  web:
    name: Web viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test -- --run

  supply-chain:
    name: Dependencies, licenses, advisories, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web audit --omit=dev --audit-level=high
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock pip-audit==2.10.1
        working-directory: perception
      - run: pip-audit --local --skip-editable
        working-directory: perception

  ci-pass:
    name: ci-pass
    if: always()
    needs: [policy, rust, python, docs, web, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required jobs
        run: |
          test "${{ needs.policy.result }}" = success
          test "${{ needs.rust.result }}" = success
          test "${{ needs.python.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.supply-chain.result }}" = success
