name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/check-policy.sh
      - run: python scripts/validate_manifests.py

  rust:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Repeat canonical reference render three times
        run: |
          first=$(cargo run --quiet --locked -- validate render)
          second=$(cargo run --quiet --locked -- validate render)
          third=$(cargo run --quiet --locked -- validate render)
          test "$first" = "$second"
          test "$second" = "$third"
      - run: cargo run --quiet --locked -- render region artifacts/reference.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: original-bootstrap-reference-render
          path: artifacts/reference.ppm
          if-no-files-found: error

  python:
    name: Python perception contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perception
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perception/requirements-dev.lock
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest

  docs:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - run: mdbook build
      - run: mdbook test

  web:
    name: Web viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test -- --run

  supply-chain:
    name: Dependencies, licenses, advisories, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock pip-audit==2.10.1
        working-directory: perception
      - run: pip-audit --local --skip-editable
        working-directory: perception

  ci-pass:
    name: ci-pass
    if: always()
    needs: [policy, rust, python, docs, web, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required jobs
        run: |
          test "${{ needs.policy.result }}" = success
          test "${{ needs.rust.result }}" = success
          test "${{ needs.python.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.supply-chain.result }}" = success
