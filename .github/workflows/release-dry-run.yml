name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Validate and assemble unpublished artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - run: scripts/check-policy.sh
      - run: python scripts/validate_manifests.py
      - run: cargo test --workspace --locked
      - name: Verify three-run deterministic reference hash
        run: |
          first=$(cargo run --quiet --locked -- validate render)
          second=$(cargo run --quiet --locked -- validate render)
          third=$(cargo run --quiet --locked -- validate render)
          test "$first" = "$second"
          test "$second" = "$third"
      - run: cargo run --quiet --locked -- render region artifacts/reference.ppm
      - run: mdbook build
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Assemble dry-run bundle
        run: |
          mkdir -p artifacts/release-dry-run
          cp artifacts/reference.ppm artifacts/release-dry-run/
          cp release.json render.manifest.json style.lock.json artifacts/release-dry-run/
          cp -R book artifacts/release-dry-run/documentation
          cp -R web/dist artifacts/release-dry-run/viewer
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: artifacts/release-dry-run
          if-no-files-found: error
