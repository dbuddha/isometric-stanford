schema = "isometric-evidence/v1"

[[claim]]
id = "BOOT-DET-001"
statement = "The original bootstrap fixture renders identical indexed bytes across repeated calls in one pinned process."
evidence = ["cargo test -p isometric-render reference_render_is_byte_deterministic"]
status = "implemented"

[[claim]]
id = "BOOT-STYLE-001"
statement = "Every bootstrap pixel is an index into a palette containing at most 128 colors."
evidence = ["cargo test -p isometric-render every_pixel_is_in_the_palette", "cargo test -p isometric-style"]
status = "implemented"

[[claim]]
id = "BOOT-TRANSIENT-001"
statement = "The v1 semantic enum and committed style assets cannot represent a person or vehicle."
evidence = ["cargo test --workspace", "scripts/check-policy.sh"]
status = "implemented"

[[claim]]
id = "VS-QUAL-001"
statement = "The complete Stanford vertical slice satisfies all accepted qualification gates."
evidence = []
status = "not-implemented"

[[claim]]
id = "PROTO-CONTRACT-001"
statement = "The exact hero bounds, epoch, source roles, Google exclusion, visual comparison protocol, and stop conditions are versioned and policy-validated."
evidence = ["source.lock.json", "ADR 0004", "ADR 0005", "research/2026-08-17-prototype-source-contract.md", "python scripts/validate_manifests.py"]
status = "implemented"

[[claim]]
id = "PROTO-SOURCE-001"
statement = "Approved hero sources synchronize into a bounded-memory content-addressed cache only after exact length and SHA-256 verification."
evidence = ["cargo test -p isometric-source", "cargo run --locked -- source sync", "python scripts/validate_manifests.py"]
status = "implemented"

[[claim]]
id = "PROTO-FIXTURE-001"
statement = "Licensed portable fixtures cover polygon holes, building parts, roads, canopy, confidence, explicit unknowns, and fail-closed provenance."
evidence = ["fixtures/world/representative.json", "fixtures/world/invalid/missing-source-rights.json", "fixtures/world/invalid/unknown-source.json", "python scripts/validate_world_fixtures.py"]
status = "implemented"

[[claim]]
id = "PROTO-WORLD-001"
statement = "The Rust world model validates immutable polygonal geometry, semantic metadata, provenance, review state, origin, partitions, and integer screen bounds without transient variants."
evidence = ["cargo test -p isometric-world", "cargo clippy -p isometric-world --all-targets --all-features -- -D warnings", "fixtures/world/representative.json"]
status = "implemented"

[[claim]]
id = "PROTO-COMPILE-001"
statement = "Locked OSM and Overture vectors compile deterministically into an inspectable 2,820-object hero world with stable IDs, integer coordinates, named landmark evidence, explicit unknown coverage, and a verified source-to-world hash chain."
evidence = ["cargo test -p isometric-world hero_compile_is_deterministic_and_inspectable", "cargo run --release --locked -- world compile", "cargo run --locked -- world inspect", "world.manifest.json"]
status = "implemented"

[[claim]]
id = "PROTO-RASTER-001"
statement = "The safe-Rust raster core performs bounded fixed-point triangle fill, shared-edge ownership, integer depth, stable equal-depth tie-breaking, and palette-indexed output with exactly five pixel-buffer bytes per active pixel."
evidence = ["cargo test -p isometric-render raster::tests", "cargo clippy -p isometric-render --all-targets --all-features --locked -- -D warnings", "docs/chapters/rendering.md"]
status = "implemented"

[[claim]]
id = "PROTO-SCENE-001"
statement = "The canonical hero world renders as a deterministic 1,950 by 873 Stanford-shaped indexed preview with polygon holes, ground and hardscape classes, empty parking, flat roofs, and directional facades."
evidence = ["cargo test -p isometric-render hero_world_produces_deterministic_non_abstract_art", "cargo run --release --locked -- render region artifacts/render/hero.ppm", "render.manifest.json", "CI artifact deterministic-render-evidence"]
status = "implemented"

[[claim]]
id = "PROTO-GRAMMAR-001"
statement = "The versioned style pack deterministically controls faceted vegetation, hard shadows, palette-only one-pixel outlines, and tile-independent world-anchored material patterns."
evidence = ["cargo test -p isometric-style", "cargo test -p isometric-render scene::tests", "styles/stanford_v1/style.toml", "docs/chapters/rendering.md", "CI artifact deterministic-render-evidence"]
status = "implemented"

[[claim]]
id = "PROTO-QUAL-001"
statement = "The complete Stanford hero prototype satisfies all accepted qualification gates."
evidence = []
status = "not-implemented"
